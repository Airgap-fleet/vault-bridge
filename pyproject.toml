[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vault-bridge"
version = "1.0.0"
description = "Bridge your AI assistant to local knowledge vaults — read, write, and search notes without cloud dependencies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "pydantic-settings>=2.3",
    "aiofiles>=24.0",
    "pillow>=10.0",
]

[project.scripts]
vault-bridge = "obsidian_mcp.server:main"
vault-bridge-configure = "obsidian_mcp.configure:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false

[[tool.mypy.overrides]]
module = [
    "fastmcp",
    "fastmcp.*",
    "pydantic",
    "pydantic.*",
    "pydantic_settings",
    "pydantic_settings.*",
    "structlog",
    "structlog.*",
    "yaml",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]