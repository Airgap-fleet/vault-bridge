[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-mcp"
version = "1.0.0"
description = "FastMCP Obsidian Vault tools for reading, writing, and searching notes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "pydantic-settings>=2.3",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]