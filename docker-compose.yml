# Obsidian MCP — Docker Compose for Local Testing

services:
  obsidian-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/afaas/obsidian-mcp:1.0.0
    container_name: obsidian-mcp-test
    user: "10001:10001"
    environment:
      - OBSIDIAN_MCP_VAULT_PATH=/vault
      - OBSIDIAN_MCP_TRANSPORT=stdio
      - OBSIDIAN_MCP_LOG_LEVEL=DEBUG
      - OBSIDIAN_MCP_MAX_FILE_SIZE=10485760
    volumes:
      - ./test-vault:/vault:rw
    # For SSE/HTTP testing, uncomment:
    # ports:
    #   - "8000:8000"
    # environment:
    #   - OBSIDIAN_MCP_TRANSPORT=sse
    #   - OBSIDIAN_MCP_API_KEY=test-key-123
    #   - OBSIDIAN_MCP_HOST=0.0.0.0
    #   - OBSIDIAN_MCP_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import obsidian_mcp; print('OK')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Test agent container (optional - for integration testing)
  test-agent:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: ghcr.io/afaas/obsidian-mcp-test:1.0.0
    container_name: obsidian-mcp-test-agent
    depends_on:
      obsidian-mcp:
        condition: service_healthy
    volumes:
      - ./test-vault:/vault:ro
    environment:
      - VAULT_PATH=/vault
    command: python -m pytest /app/tests/ -v
    profiles:
      - test