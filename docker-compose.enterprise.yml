version: '3.8'

# Vault Bridge — Enterprise POC Deployment
# Usage: docker compose -f docker-compose.enterprise.yml up -d
# 
# For production: use docker-compose.prod.yml with secrets, healthchecks, monitoring

services:
  vault-bridge:
    image: ghcr.io/airgap-fleet/vault-bridge:1.0.0
    # build: .                                    # Uncomment for local build
    container_name: vault-bridge
    restart: unless-stopped
    user: "10001:10001"                           # Non-root (matches Dockerfile)
    
    # Vault mount - REPLACE with your vault path
    volumes:
      - ${VAULT_PATH:-./test-vault}:/vault:ro     # Read-only for compliance
      # - ./config.enterprise.yaml:/app/config.yaml:ro  # Optional config file
    
    # Network (internal only - no external ports by default)
    networks:
      - vault-bridge-internal
    
    # Environment - ALL configurable via .env file
    environment:
      # REQUIRED
      - OBSIDIAN_MCP_VAULT_PATH=/vault
      
      # TRANSPORT (choose one)
      - OBSIDIAN_MCP_TRANSPORT=streamable-http    # stdio | sse | streamable-http
      - OBSIDIAN_MCP_HOST=0.0.0.0
      - OBSIDIAN_MCP_PORT=8000
      - OBSIDIAN_MCP_PATH=/mcp
      
      # AUTH (REQUIRED for HTTP transports)
      - OBSIDIAN_MCP_API_KEY=${VAULT_BRIDGE_API_KEY:-changeme-generate-with-openssl-rand-hex-32}
      - OBSIDIAN_MCP_API_KEY_HEADER=X-API-Key
      
      # LOGGING (SIEM-ready)
      - OBSIDIAN_MCP_LOG_LEVEL=INFO
      - OBSIDIAN_MCP_LOG_JSON=true
      
      # SECURITY/COMPLIANCE
      - OBSIDIAN_MCP_READ_ONLY=false              # Set true for regulated environments
      - OBSIDIAN_MCP_FOLLOW_SYMLINKS=false
      - OBSIDIAN_MCP_MAX_FILE_SIZE=10485760
      
      # RATE LIMITING (production: use Redis)
      - OBSIDIAN_MCP_RATE_LIMIT_ENABLED=true
      - OBSIDIAN_MCP_RATE_LIMIT_REQUESTS=100
      - OBSIDIAN_MCP_RATE_LIMIT_WINDOW_SECONDS=60
      - OBSIDIAN_MCP_RATE_LIMIT_STORAGE=memory    # memory | redis
      # - OBSIDIAN_MCP_REDIS_URL=redis://redis:6379/0
      
      # CONNECTION POOLING (opt-in)
      - OBSIDIAN_MCP_POOL_SIZE=0
      - OBSIDIAN_MCP_POOL_TIMEOUT=30
      
      # ENTERPRISE FEATURES
      - OBSIDIAN_MCP_AUDIT_ENABLED=true
      - OBSIDIAN_MCP_HEALTH_CHECK_ENABLED=true
      - OBSIDIAN_MCP_METRICS_ENABLED=true
    
    # Health checks for K8s/Docker orchestration
    healthcheck:
      test: ["CMD", "python", "-c", "import obsidian_mcp; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits (adjust for your workload)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Redis for distributed rate limiting (production)
  # redis:
